<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>카페 탐색 서비스 | 데이터 기반 화면 구조</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f4f7fb;color:#172033;line-height:1.55}main{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:36px 0 56px}.hero{margin-bottom:18px}.eyebrow{margin:0 0 6px;color:#c35c18;font-size:12px;font-weight:900;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(30px,6vw,52px);letter-spacing:-.04em}.controls{display:grid;grid-template-columns:1fr repeat(3,minmax(120px,180px));gap:10px;margin:22px 0}.controls input,.controls select{width:100%;height:44px;border:1px solid #d5dce7;border-radius:10px;background:#fff;padding:0 12px;font:inherit}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:#667085;font-size:14px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:18px}.card h2{margin:0 0 6px;font-size:19px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tags span{padding:5px 8px;border-radius:999px;background:#fff1e8;color:#a84f16;font-size:12px}.empty{grid-column:1/-1;padding:44px;text-align:center;background:#fff;border:1px dashed #cbd4e1;border-radius:16px;color:#667085}@media(max-width:820px){.controls{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.controls,.list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <p class="eyebrow">DATA-DRIVEN SERVICE UI</p>
    <h1>카페 탐색 서비스</h1>
  </section>
  <section class="controls" aria-label="카페 탐색 조건">
    <input id="keyword" type="search" placeholder="카페명 또는 태그 검색">
    <select id="area"><option value="">전체 지역</option><option>성수동</option><option>건대입구</option></select>
    <select id="outlet"><option value="">콘센트 전체</option><option value="true">콘센트 있음</option></select>
    <select id="sort"><option value="">기본 순서</option><option value="price">가격 낮은 순</option></select>
  </section>
  <div class="meta"><strong id="count"></strong><span>샘플 JSON 배열 → 조건 처리 → 반복 렌더링</span></div>
  <section class="list" id="cafe-list"></section>
</main>
<script>
const cafes=[
  {id:1,name:'카페 라온',area:'성수동',priceLevel:2,hasOutlet:true,hasWifi:true,tags:['카공','조용함']},
  {id:2,name:'모노커피',area:'성수동',priceLevel:1,hasOutlet:false,hasWifi:true,tags:['저렴함','테이크아웃']},
  {id:3,name:'페이지룸',area:'건대입구',priceLevel:2,hasOutlet:true,hasWifi:true,tags:['카공','넓은좌석']}
];
const list=document.querySelector('#cafe-list');const count=document.querySelector('#count');
function render(){const keyword=document.querySelector('#keyword').value.trim().toLowerCase();const area=document.querySelector('#area').value;const outlet=document.querySelector('#outlet').value;const sort=document.querySelector('#sort').value;let result=cafes.filter(c=>(!keyword||c.name.toLowerCase().includes(keyword)||c.tags.some(t=>t.toLowerCase().includes(keyword)))&&(!area||c.area===area)&&(!outlet||String(c.hasOutlet)===outlet));if(sort==='price')result=[...result].sort((a,b)=>a.priceLevel-b.priceLevel);count.textContent=`결과 ${result.length}건`;list.innerHTML=result.length?result.map(c=>`<article class="card"><h2>${c.name}</h2><div>${c.area} · 가격대 ${c.priceLevel} · ${c.hasOutlet?'콘센트 있음':'콘센트 없음'} · ${c.hasWifi?'Wi-Fi 있음':'Wi-Fi 없음'}</div><div class="tags">${c.tags.map(t=>`<span>${t}</span>`).join('')}</div></article>`).join(''):'<div class="empty">조건에 맞는 카페가 없습니다.</div>'}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',render));render();
</script>
</body>
</html>
