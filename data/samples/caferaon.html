<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카페 라온</title>
</head>
<body>
  <header>
    <h1>카페 라온</h1>
    <p>조용하게 공부하기 좋은 성수동 카페</p>
  </header>

  <main>
    <section>
      <h2>카페 정보</h2>
      <p>위치: 서울 성동구 성수이로 00</p>
      <p>운영시간: 09:00 ~ 22:00</p>
      <p>와이파이: 있음</p>
      <p>콘센트: 일부 좌석 이용 가능</p>
    </section>

    <section>
      <h2>대표 메뉴</h2>
      <article>
        <h3>아메리카노</h3>
        <p>4,500원</p>
      </article>
      <article>
        <h3>카페라떼</h3>
        <p>5,000원</p>
      </article>
      <article>
        <h3>바스크 치즈케이크</h3>
        <p>6,500원</p>
      </article>
    </section>

    <section>
      <h2>이용 안내</h2>
      <p>노트북 이용이 가능하며 2시간 이상 이용 시 추가 주문을 권장한다</p>
    </section>
  </main>

  <footer>
    <a href="#">지도 보기</a>
    <a href="#">SNS 보기</a>
  </footer>
</body>
</html>
