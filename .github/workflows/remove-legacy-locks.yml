name: Remove legacy lock hashes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-legacy-locks.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/remove-legacy-locks.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove legacy password hashes"
          git push
