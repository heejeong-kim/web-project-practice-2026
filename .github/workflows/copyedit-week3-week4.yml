name: Copyedit week 3 and 4 lectures

on:
  push:
    paths:
      - '.github/workflows/copyedit-week3-week4.yml'

permissions:
  contents: write

jobs:
  copyedit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply copyediting corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'data/lectures/week03.md': [
                  ('선택되기 쉬위므로', '선택되기 쉬우므로'),
                  ('기획에서는 ‘**문제 → 요구 → 기능’** 순서로 연결해야', '기획에서는 **‘문제 → 요구 → 기능’ 순서로** 연결해야'),
                  ('핵심 페르소나를 선정하여 최종 어떤 가치를 제공할지 한 문장으로 정리함', '핵심 페르소나를 선정하고 최종적으로 어떤 가치를 제공할지 한 문장으로 정리함'),
              ],
              'data/lectures/week04.md': [
                  ('필수 트랙 완료시 18점 만점으로 채점', '필수 트랙 완료 시 18점 만점으로 채점'),
                  ('팀의 공동 설계 결과가 산출물로 처리 함', '팀의 공동 설계 결과가 산출물로 처리됨'),
                  ('제외 판정 항목이 Must로 돌아오지 않도록 먼저 확인해야하며 특히 여러 사용자가 같은 최신 상태를 공유해야 하는 기능은 필수 트랙의 LocalStorage 범위로 구현할 수 없음 재확인 필요', '제외 판정 항목이 Must로 돌아오지 않도록 먼저 확인해야 하며, 특히 여러 사용자가 같은 최신 상태를 공유해야 하는 기능은 필수 트랙의 LocalStorage 범위로 구현할 수 없음을 재확인해야 함'),
                  ('검증하는 도구로써 색상과 이미지 대신', '검증하는 도구로서 색상과 이미지 대신'),
              ],
          }

          for filename, items in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lectures/week03.md data/lectures/week04.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: proofread week 3 and 4 lecture copy"
          git push
