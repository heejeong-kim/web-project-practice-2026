<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2026년 2학기 웹프로젝트 실습 주차별 강의교안">
  <title>웹프로젝트 실습 | 강의교안</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/lecture.css">
  <style>
    html,body,button,input,a{font-family:"IBM Plex Sans KR",sans-serif}
    html body .lecture-shell{width:min(1520px,calc(100% - 64px))!important}
    .lecture-layout{grid-template-columns:264px minmax(0,1fr)!important}
    .lecture-header{position:relative!important;top:auto!important;z-index:20!important}
    .lecture-week-bar{position:sticky;top:0;z-index:120;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);border-bottom:1px solid #dfe4eb;box-shadow:0 8px 24px rgba(20,32,52,.06)}
    .lecture-week-bar-inner{min-height:84px;display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);align-items:center;gap:24px}
    .lecture-week-title{min-width:0;padding-right:22px;border-right:1px solid #e3e7ee}
    .lecture-week-title span{display:block;margin-bottom:2px;color:#d7641d;font-size:11px;font-weight:800;letter-spacing:.12em}
    .lecture-week-title strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#111827;font-size:18px;line-height:1.35;letter-spacing:-.02em}
    .lecture-week-bar .week-menu{display:grid!important;grid-template-columns:repeat(15,minmax(0,1fr))!important;gap:6px!important;padding:0!important;background:transparent!important;border:0!important}
    .lecture-week-bar .week-menu a{min-width:0;min-height:40px;border:1px solid #d8dee8!important;border-radius:9px;background:#fff!important;color:#596579!important;font-size:12px;font-weight:800;box-shadow:none;transform:none!important}
    .lecture-week-bar .week-menu a:hover{border-color:#ffb27f!important;background:#fff3eb!important;color:#a94e13!important}
    .lecture-week-bar .week-menu a.is-current{border-color:#ff8a3d!important;background:#ff8a3d!important;color:#1e1209!important;box-shadow:0 7px 16px rgba(255,138,61,.22)}
    .lecture-week-bar .week-menu a.is-pending:not(.is-current){color:#8b95a5!important;border-color:#dfe4eb!important;background:#f4f6f9!important}
    .toc-card{top:108px!important}
    .lecture-content h1,.lecture-content h2,.lecture-content h3{scroll-margin-top:108px!important}
    .lecture-pending{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid #e1e6ee;border-radius:24px;padding:48px 24px;margin-bottom:40px}
    .lecture-pending-mark{display:grid;place-items:center;width:78px;height:78px;border-radius:22px;background:#111827;color:#ff8a3d;font-size:28px;font-weight:700;margin-bottom:22px}
    .lecture-pending h2{font-size:32px;margin:0 0 10px;letter-spacing:-.03em}
    .lecture-pending p{margin:0;color:#667085}
    .lecture-pending a{margin-top:26px;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;background:#ff8a3d;color:#1e1209;text-decoration:none;font-weight:700}
    @media(max-width:1100px){
      .lecture-week-bar-inner{grid-template-columns:220px minmax(0,1fr);gap:16px}
      .lecture-week-bar .week-menu{display:flex!important;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin;padding-bottom:4px!important}
      .lecture-week-bar .week-menu a{flex:0 0 58px}
    }
    @media(max-width:920px){
      .lecture-layout{grid-template-columns:1fr!important}
      .lecture-week-bar-inner{grid-template-columns:1fr;gap:8px;padding-top:10px;padding-bottom:10px}
      .lecture-week-title{padding-right:0;border-right:0}
      .lecture-week-title strong{font-size:16px}
      .toc-card{top:130px!important}
      .lecture-content h1,.lecture-content h2,.lecture-content h3{scroll-margin-top:130px!important}
    }
    @media(max-width:680px){
      html body .lecture-shell{width:min(100% - 28px,1520px)!important}
      .lecture-week-bar-inner{width:100%!important;padding-left:14px;padding-right:14px}
      .lecture-week-title span{font-size:10px}
      .lecture-week-title strong{font-size:15px}
      .lecture-week-bar .week-menu a{flex-basis:54px;min-height:38px}
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#lecture-content">본문 바로가기</a>

  <header class="lecture-header">
    <div class="lecture-shell header-inner">
      <a class="lecture-brand" href="./index.html" aria-label="웹프로젝트 실습 메인으로 이동">
        <span class="brand-mark">WP</span>
        <span><strong>웹프로젝트 실습</strong><small>2026 · 2학기</small></span>
      </a>
      <nav class="lecture-nav" aria-label="강의교안 메뉴">
        <a href="./index.html#weeks">전체 주차</a>
        <a href="https://app.notion.com/p/3b8a50f0761580429d64ff509f92a9be" target="_blank" rel="noopener noreferrer">팀별 URL</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="lecture-hero">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="lecture-shell lecture-hero-inner">
        <div>
          <p class="lecture-kicker" id="lecture-week">WEEK</p>
          <h1 id="lecture-title">강의교안</h1>
          <p id="lecture-summary" class="lecture-summary"></p>
          <div id="lecture-keywords" class="keyword-list"></div>
        </div>
        <div class="hero-index-card">
          <span>COURSE LAB</span>
          <strong id="hero-week-number">01</strong>
          <small>WEB PROJECT PRACTICE</small>
        </div>
      </div>
    </section>

    <section class="lecture-week-bar" aria-label="주차별 강의교안 이동">
      <div class="lecture-shell lecture-week-bar-inner">
        <div class="lecture-week-title">
          <span id="sticky-week-label">01주차</span>
          <strong id="sticky-week-title">강의교안</strong>
        </div>
        <nav class="week-menu" id="week-menu" aria-label="1주차부터 15주차 강의교안"></nav>
      </div>
    </section>

    <div class="lecture-shell lecture-layout">
      <aside class="lecture-toc" aria-label="페이지 목차">
        <div class="toc-card">
          <strong>CONTENTS</strong>
          <nav id="toc-list"></nav>
        </div>
      </aside>

      <article id="lecture-content" class="lecture-content" tabindex="-1">
        <p class="lecture-loading">강의교안을 불러오는 중입니다.</p>
      </article>
    </div>

    <nav class="lecture-pager lecture-shell" aria-label="이전 다음 주차">
      <a id="prev-week" class="pager-link" href="#"><small>PREV</small><strong></strong></a>
      <a id="next-week" class="pager-link next" href="#"><small>NEXT</small><strong></strong></a>
    </nav>
  </main>

  <footer class="lecture-footer">
    <div class="lecture-shell">
      <strong>웹프로젝트 실습</strong>
      <p>2026년 2학기 · 데이터 기반 웹서비스 제작</p>
    </div>
  </footer>

  <button class="top-button" id="top-button" type="button" aria-label="페이지 맨 위로 이동"><span>↑</span><small>TOP</small></button>

  <script src="./data/weeks.js"></script>
  <script src="./js/lecture.js"></script>
</body>
</html>
