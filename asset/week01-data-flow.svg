<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">JSON과 LocalStorage 데이터 흐름</title><desc id="desc">JSON 기본 데이터가 JavaScript 처리와 화면 출력으로 이어지고 사용자 행동이 LocalStorage 저장과 화면 상태 복원으로 연결되는 흐름</desc><rect width="1200" height="300" rx="28" fill="#f5f7fb"/><g font-family="Arial, sans-serif" text-anchor="middle"><g fill="#fff" stroke="#d5dce7" stroke-width="2"><rect x="40" y="95" width="190" height="110" rx="18"/><rect x="280" y="95" width="190" height="110" rx="18"/><rect x="520" y="95" width="190" height="110" rx="18"/><rect x="760" y="95" width="190" height="110" rx="18"/><rect x="1000" y="95" width="160" height="110" rx="18"/></g><g fill="#172033"><text x="135" y="135" font-size="18" font-weight="700">JSON 기본 데이터</text><text x="135" y="165" font-size="14">공통 원천 데이터</text><text x="375" y="135" font-size="18" font-weight="700">JavaScript 처리</text><text x="375" y="165" font-size="14">검색·필터·정렬</text><text x="615" y="135" font-size="18" font-weight="700">화면 출력</text><text x="615" y="165" font-size="14">목록·상세 렌더링</text><text x="855" y="135" font-size="18" font-weight="700">사용자 행동</text><text x="855" y="165" font-size="14">선택·즐겨찾기</text><text x="1080" y="135" font-size="18" font-weight="700">LocalStorage</text><text x="1080" y="165" font-size="14">개인 상태 저장</text></g><g stroke="#ff8a3d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M230 150h38"/><path d="M470 150h38"/><path d="M710 150h38"/><path d="M950 150h38"/></g><g fill="#ff8a3d"><path d="M268 150l-12-8v16z"/><path d="M508 150l-12-8v16z"/><path d="M748 150l-12-8v16z"/><path d="M988 150l-12-8v16z"/></g><text x="600" y="255" fill="#667085" font-size="16">페이지 재방문 시 JSON 원본 + LocalStorage 사용자 상태를 id 기준으로 다시 결합</text></g></svg>